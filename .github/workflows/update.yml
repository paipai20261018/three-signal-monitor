name: 更新信号数据

on:
  schedule:
    - cron: "0 1 * * *"     # 每天 UTC 1 点 ≈ 北京时间 9 点（盘前）
    - cron: "0 14 * * 1-5"  # 工作日 UTC 14 点 ≈ 北京 22 点（盘后）
  workflow_dispatch:         # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 抓取数据并计算信号
        run: python fetch_data.py
      - name: 提交 data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "无变化" || git commit -m "更新信号数据 $(date -u +%F)"
          git push
